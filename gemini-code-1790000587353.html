<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0D1413; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px)) 12px;
  }
  #root { width: 100%; display: flex; justify-content: center; }
  
  /* Custom Scrollbar */
  .harbor-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .harbor-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  
  input[type="file"] { display: none; }
  
  /* Keyframes */
  @keyframes harbor-pop { 0% { transform: scale(0.92) translateY(10px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
  @keyframes harbor-slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes harbor-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes harbor-spin { to { transform: rotate(360deg); } }
  @keyframes wave-pulse { 0%, 100% { height: 6px; } 50% { height: 22px; } }

  .harbor-pop { animation: harbor-pop 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .harbor-sheet { animation: harbor-slide-up 0.35s cubic-bezier(0.32, 0.72, 0, 1) forwards; }
  .harbor-fade { animation: harbor-fade 0.22s ease forwards; }
  
  @media (prefers-reduced-motion: reduce) { 
    .harbor-pop, .harbor-sheet, .harbor-fade { animation: none !important; } 
  }
</style>

<div id="root">

        '<p style="font-size:13px;color:#6A7A76;word-break:break-word;line-height:1.5;">' + (e.message || "Unknown error occurred.") + '</p>' +

/* ---------- Helpers ---------- */
function isoDate(d) { const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${day}`; }
function prettyDate(iso) { const d = new Date(iso+"T00:00:00"); return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }
function fullTimestamp(ms) { const d = new Date(ms); return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) + " • " + d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
function safeParse(str, fallback) { try { const v = JSON.parse(str); return v == null ? fallback : v; } catch (e) { return fallback; } }
function addDays(iso, delta) { const d = new Date(iso+"T00:00:00"); d.setDate(d.getDate()+delta); return isoDate(d); }

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read file"));
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    readFileAsDataUrl(file).then((raw) => {
      const img = new Image();
      img.onerror = () => reject(new Error("Could not load image"));
      img.onload = () => {
        const maxDim = 800;
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height*maxDim/width); width = maxDim; }
        else if (height >= width && height > maxDim) { width = Math.round(width*maxDim/height); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.src = raw;
    }).catch(reject);
  });
}

function makeVideoPoster(videoDataUrl) {
  return new Promise((resolve) => {
    const vid = document.createElement("video");
    vid.src = videoDataUrl;
    vid.muted = true;
    vid.playsInline = true;
    vid.addEventListener("loadeddata", () => { try { vid.currentTime = Math.min(0.2, vid.duration/2 || 0.1); } catch(e) { resolve(null); } });
    vid.addEventListener("seeked", () => {
      try {
        const canvas = document.createElement("canvas");
        const maxDim = 600;
        let w = vid.videoWidth || 320, h = vid.videoHeight || 240;
        if (w > h && w > maxDim) { h = Math.round(h*maxDim/w); w = maxDim; } else if (h >= w && h > maxDim) { w = Math.round(w*maxDim/h); h = maxDim; }
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(vid, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.7));
      } catch (e) { resolve(null); }
    });
    vid.addEventListener("error", () => resolve(null));
    setTimeout(() => resolve(null), 3000);
  });
}

function getAudioDuration(dataUrl) {
  return new Promise((resolve) => {
    const audio = document.createElement("audio");
    audio.preload = "metadata";
    audio.src = dataUrl;
    audio.addEventListener("loadedmetadata", () => resolve(isFinite(audio.duration) ? Math.round(audio.duration) : null));
    audio.addEventListener("error", () => resolve(null));
    setTimeout(() => resolve(null), 3000);
  });
}

function formatDuration(sec) {
  if (sec === null || sec === undefined || isNaN(sec)) return "0:00";
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, "0")}`;
}

async function processMediaFile(file) {
  const isVideo = file.type.startsWith("video");
  const isAudio = file.type.startsWith("audio");
  if (isVideo) {
    if (file.size > MAX_VIDEO_BYTES) throw new Error(`"${file.name}" is over 10MB limit.`);
    const dataUrl = await readFileAsDataUrl(file);
    const posterDataUrl = await makeVideoPoster(dataUrl);
    return { type: "video", dataUrl, posterDataUrl };
  }
  if (isAudio) {
    if (file.size > MAX_VIDEO_BYTES) throw new Error(`"${file.name}" is too large.`);
    const dataUrl = await readFileAsDataUrl(file);
    const duration = await getAudioDuration(dataUrl);
    return { type: "audio", dataUrl, posterDataUrl: null, duration };
  }
  const dataUrl = await compressImage(file);
  return { type: "image", dataUrl, posterDataUrl: null };
}

function useStorage() {
  const memory = useRef({});
  const available = typeof window !== "undefined" && window.storage;
  async function get(key, shared) {
    if (available) { try { const r = await window.storage.get(key, !!shared); return r ? r.value : null; } catch (e) { return null; } }
    return memory.current[key] || null;
  }
  async function set(key, value, shared) {
    if (available) { try { await window.storage.set(key, value, !!shared); return true; } catch (e) { return false; } }
    memory.current[key] = value; return true;
  }
  async function del(key, shared) {
    if (available) { try { await window.storage.delete(key, !!shared); return true; } catch (e) { return false; } }
    delete memory.current[key]; return true;
  }
  async function list(prefix, shared) {
    if (available) { try { const r = await window.storage.list(prefix, !!shared); return r ? r.keys : []; } catch (e) { return []; } }
    return [];
  }
  return { get, set, del, list };
}

  const recordingTimerRef = useRef(null);
  const recordingSecondsRef = useRef(0);
  const [isRecording, setIsRecording] = useState(false);
  const [recordingSeconds, setRecordingSeconds] = useState(0);

  const MAX_RECORD_SECONDS = 180;

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = (typeof MediaRecorder !== "undefined" && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported("audio/webm")) ? "audio/webm" : "";
      const recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      recordedChunksRef.current = [];
      recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunksRef.current.push(e.data); };
      recorder.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        if (recordingTimerRef.current) { clearInterval(recordingTimerRef.current); recordingTimerRef.current = null; }
        const blob = new Blob(recordedChunksRef.current, { type: recorder.mimeType || "audio/webm" });
        const finalDuration = recordingSecondsRef.current;
        setIsRecording(false);
        setRecordingSeconds(0);
        if (blob.size === 0) return;
        if (blob.size > MAX_VIDEO_BYTES) { showToast("Recording exceeds size limits."); return; }
        try {
          const dataUrl = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(new Error("Read failed"));
            reader.readAsDataURL(blob);
          });
          setAddMediaList((prev) => [...prev, { tempId: "t" + Date.now(), type: "audio", dataUrl, posterDataUrl: null, duration: finalDuration }]);
        } catch (e) { showToast("Could not save recording"); }
      };
      mediaRecorderRef.current = recorder;
      recordingSecondsRef.current = 0;
      setRecordingSeconds(0);
      recorder.start();
      setIsRecording(true);
      recordingTimerRef.current = setInterval(() => {
        recordingSecondsRef.current += 1;
        setRecordingSeconds(recordingSecondsRef.current);
        if (recordingSecondsRef.current >= MAX_RECORD_SECONDS) stopRecording();
      }, 1000);
    } catch (err) {
      showToast("Microphone access denied.");
    }
  }

  function stopRecording() {
    if (mediaRecorderRef.current && mediaRecorderRef.current.state !== "inactive") mediaRecorderRef.current.stop();
  }

    if (!el) return;

        setPovs(safeParse(c, []));
        setEntries(safeParse(e, []));
        setMedia(safeParse(m, []));

  const persistEntries = useCallback(async (next) => { setEntries(next); await storage.set("harbor-entries", JSON.stringify(next)); }, []);

  function mediaById(id) { return media.find((m) => m.id === id) || null; }
  function povById(id) { return povs.find((p) => p.id === id) || null; }

  async function publishSharedSnapshot(povId, povsArr, entriesArr, mediaArr) {
    const pov = povsArr.find((p) => p.id === povId);
    if (!pov || !pov.shared) return;
    const relatedEntries = entriesArr.filter((e) => e.tags.some((t) => t.povId === povId));
    const neededIds = new Set();
    relatedEntries.forEach((e) => e.mediaIds.forEach((id) => neededIds.add(id)));
    const relatedMedia = mediaArr.filter((m) => neededIds.has(m.id));
    const snapshot = { pov, entries: relatedEntries, media: relatedMedia, sharedAt: Date.now() };
    await storage.set(`shared-pov:${povId}`, JSON.stringify(snapshot), true);
  }

  async function setPovShared(povId, shared) {
    const next = povs.map((p) => (p.id === povId ? { ...p, shared } : p));
    await persistPovs(next);
    if (shared) {
      await publishSharedSnapshot(povId, next, entries, media);
      showToast("POV link shared publicly");
    } else {
      await storage.del(`shared-pov:${povId}`, true);
      showToast("POV made private");
    }
  }

  async function loadSharedPovs() {
    setSharedLoading(true);
    const keys = await storage.list("shared-pov:", true);
    const list = [];
    for (const k of keys) {
      const v = await storage.get(k, true);
      const parsed = safeParse(v, null);
      if (parsed) list.push(parsed);
    }
    setSharedPovs(list.sort((a, b) => (b.sharedAt || 0) - (a.sharedAt || 0)));
    setSharedLoading(false);
  }

  function computeStreak(povId, entriesArr) {
    const dates = new Set(entriesArr.filter((e) => e.tags.some((t) => t.povId === povId)).map((e) => isoDate(new Date(e.createdAt))));
    let count = 0, cursor = new Date();
    if (!dates.has(isoDate(cursor))) cursor.setDate(cursor.getDate() - 1);
    while (dates.has(isoDate(cursor))) { count++; cursor.setDate(cursor.getDate() - 1); }
    return count;
  }
  function getStreak(povId) { return computeStreak(povId, entries); }

  function povTilesFor(povId, subFilter) {
    const tagged = entries.filter((e) => e.tags.some((t) => t.povId === povId && (subFilter === "all" || (t.subsectionId || "none") === subFilter)));
    const sorted = tagged.slice().sort((a, b) => b.createdAt - a.createdAt);
    const tiles = [];
    sorted.forEach((e) => {
      if (e.mediaIds.length === 0) { tiles.push({ entry: e, media: null }); }
      else e.mediaIds.forEach((id) => { const m = mediaById(id); if (m) tiles.push({ entry: e, media: m }); });
    });
    return tiles;
  }

  function allPhotoTiles() {
    const sorted = entries.slice().sort((a, b) => b.createdAt - a.createdAt);
    const tiles = [];
    sorted.forEach((e) => {
      if (e.mediaIds.length === 0) tiles.push({ entry: e, media: null });
      else e.mediaIds.forEach((id) => { const m = mediaById(id); if (m) tiles.push({ entry: e, media: m }); });
    });
    return tiles;
  }

  function matchesSearch(entry) {
    const q = photosSearch.trim().toLowerCase();
    if (!q) return true;
    if ((entry.note || "").toLowerCase().includes(q)) return true;
    return entry.tags.some((t) => { const p = povById(t.povId); return p && p.name.toLowerCase().includes(q); });

  async function createPov(name, color, description) {
    const trimmed = name.trim();

    const pov = { id: "p" + Date.now(), name: trimmed, description: (description || "").trim(), color, coverMediaId: null, subsections: [], shared: false, createdAt: Date.now() };
    await persistPovs([...povs, pov]);
    return pov;
  }

  async function saveEntry() {
    const hasNote = addNote.trim().length > 0;
    const hasMedia = addMediaList.length > 0;
    if (!hasNote && !hasMedia) return;
    const preStreaks = addTags.map((t) => ({ povId: t.povId, streak: computeStreak(t.povId, entries) }));
    const newMediaObjs = addMediaList.map((m, i) => ({ id: "m" + Date.now() + i, type: m.type, dataUrl: m.dataUrl, posterDataUrl: m.posterDataUrl, duration: m.duration, createdAt: Date.now() }));
    const nextMedia = [...media, ...newMediaObjs];
    const entry = { id: "e" + Date.now(), note: addNote.trim(), createdAt: Date.now(), editedAt: null, noteHistory: [], mediaIds: newMediaObjs.map((m) => m.id), tags: addTags };
    const nextEntries = [entry, ...entries];
    await persistMedia(nextMedia);
    await persistEntries(nextEntries);
    for (const t of addTags) await publishSharedSnapshot(t.povId, povs, nextEntries, nextMedia);
    setShowAdd(false);
    showToast(addTags.length ? `Saved to ${addTags.length} POV${addTags.length > 1 ? "s" : ""}` : "Entry added");

    let best = null;
    preStreaks.forEach(({ povId, streak }) => {
      const after = computeStreak(povId, nextEntries);
      if (after > streak && (!best || after > best.streak)) best = { povId, streak: after };
    });
    if (best) {
      const pov = povs.find((p) => p.id === best.povId);
      if (celebrationTimer.current) clearTimeout(celebrationTimer.current);
      setStreakCelebration({ name: pov ? pov.name : "", streak: best.streak });
      celebrationTimer.current = setTimeout(() => setStreakCelebration(null), 2000);
    }
  }

  async function saveNoteEdit(entryId) {
    const entry = entries.find((e) => e.id === entryId);

    const trimmed = draftNote.trim();
    if (trimmed === (entry.note || "")) { setIsEditingNote(false); return; }
    const historyAddition = entry.note ? [{ id: "h" + Date.now(), note: entry.note, savedAt: entry.editedAt || entry.createdAt }] : [];
    const nextEntries = entries.map((e) => (e.id === entryId ? { ...e, note: trimmed, editedAt: Date.now(), noteHistory: [...historyAddition, ...(e.noteHistory || [])] } : e));
    await persistEntries(nextEntries);
    setIsEditingNote(false);
    showToast("Note updated");
  }

  async function deleteEntries(ids) {
    const deleted = entries.filter((e) => ids.includes(e.id));
    if (deleted.length === 0) return;
    const nextEntries = entries.filter((e) => !ids.includes(e.id));
    await persistEntries(nextEntries);
    showToast(deleted.length === 1 ? "Entry deleted" : `${deleted.length} entries deleted`);

                    {povs.map((p) => {
                      const cover = p.coverMediaId ? mediaById(p.coverMediaId) : null;
                      const count = entries.filter((e) => e.tags.some((t) => t.povId === p.id)).length;
                      return (
                        <PovCard key={p.id} name={p.name} color={p.color} cover={cover} caption={`${count} entries`} shared={p.shared} colors={C} onClick={() => setPovDetailId(p.id)} />
                      );
                    })}
                    <button onClick={() => setShowNewPovModal(true)} style={{ border: `2px dashed ${C.mistDeep}`, borderRadius: 20, background: "transparent", cursor: "pointer", aspectRatio: "4/5", width: "100%", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 6, color: C.driftwood, fontSize: 13, fontWeight: 600, breakInside: "avoid", marginBottom: 10 }}>
                      <IconPlus size={20} />
                      <span>New POV</span>
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {mainTab === "calendar" && (
            <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
              {Header({ title: "Timeline", subtitle: "Memories mapped across time" })}
              <div style={{ padding: "0 20px 12px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <button onClick={() => setCalMonth(new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1))} style={btnReset}><IconChevronLeft size={20} color={C.ink} /></button>
                <span style={{ fontFamily: "Fraunces, serif", fontSize: 16, fontWeight: 600, color: C.ink }}>
                  {calMonth.toLocaleDateString(undefined, { month: "long", year: "numeric" })}
                </span>
                <button onClick={() => setCalMonth(new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1))} style={btnReset}><IconChevronRight size={20} color={C.ink} /></button>
              </div>

              <div className="harbor-scroll" style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: "0 20px 20px" }}>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 6 }}>
                  {["M","T","W","T","F","S","S"].map((d, i) => (
                    <div key={i} style={{ textAlign: "center", fontSize: 11, fontWeight: 700, color: C.driftwood, paddingBottom: 6 }}>{d}</div>
                  ))}
                  {(() => {
                    const year = calMonth.getFullYear(), month = calMonth.getMonth();
                    const startWeekday = (new Date(year, month, 1).getDay() + 6) % 7;
                    const daysInMonth = new Date(year, month + 1, 0).getDate();
                    const cells = [];
                    for (let i = 0; i < startWeekday; i++) cells.push(null);
                    for (let d = 1; d <= daysInMonth; d++) cells.push(d);
                    
                    return cells.map((day, idx) => {
                      if (day === null) return <div key={idx} />;
                      const iso = isoDate(new Date(year, month, day));
                      const dayEntries = entries.filter((e) => isoDate(new Date(e.createdAt)) === iso);
                      const hasContent = dayEntries.length > 0;
                      return (
                        <div key={idx} style={{ aspectRatio: "1/1", borderRadius: 10, background: hasContent ? C.harborSoft : C.mist, border: `1px solid ${hasContent ? C.harbor : "transparent"}`, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", position: "relative" }}>
                          <span style={{ fontSize: 12, fontWeight: hasContent ? 700 : 500, color: hasContent ? C.harbor : C.ink }}>{day}</span>
                          {hasContent && <span style={{ width: 4, height: 4, borderRadius: "50%", background: C.harbor, marginTop: 2 }} />}
                        </div>
                      );
                    });
                  })()}
                </div>
              </div>
            </div>
          )}

          {/* Navigation Bar */}
          {selectMode ? (
            <div style={{ padding: "12px 20px calc(12px + env(safe-area-inset-bottom))", borderTop: `1px solid ${C.mistDeep}`, background: C.card, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <span style={{ fontSize: 13, fontWeight: 600, color: C.driftwood }}>{selectedEntryIds.size} Selected</span>
              <button onClick={batchDeleteSelected} disabled={selectedEntryIds.size === 0} style={{ background: selectedEntryIds.size === 0 ? C.mistDeep : C.clay, color: "#FFF", border: "none", borderRadius: 999, padding: "8px 18px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Delete</button>
            </div>
          ) : (
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-around", padding: "10px 16px calc(10px + env(safe-area-inset-bottom))", borderTop: `1px solid ${C.mistDeep}`, background: C.card }}>
              <button onClick={() => setMainTab("photos")} style={{ ...btnReset, color: mainTab === "photos" ? C.harbor : C.driftwood, flex: 1, flexDirection: "column", gap: 3 }}>
                <IconGrid size={20} />
                <span style={{ fontSize: 10, fontWeight: 600 }}>Photos</span>
              </button>
              <button onClick={() => setMainTab("povs")} style={{ ...btnReset, color: mainTab === "povs" ? C.harbor : C.driftwood, flex: 1, flexDirection: "column", gap: 3 }}>
                <IconFolder size={20} />
                <span style={{ fontSize: 10, fontWeight: 600 }}>POVs</span>
              </button>
              
              {/* Floating Add Trigger */}
              <button onClick={() => openAddSheet()} style={{ width: 48, height: 48, borderRadius: "50%", background: C.harbor, color: "#FFF", border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 6px 16px rgba(36,82,79,0.35)", margin: "-18px 8px 0" }}>
                <IconPlus size={24} />
              </button>

              <button onClick={() => setMainTab("calendar")} style={{ ...btnReset, color: mainTab === "calendar" ? C.harbor : C.driftwood, flex: 1, flexDirection: "column", gap: 3 }}>
                <IconCalendar size={20} />
                <span style={{ fontSize: 10, fontWeight: 600 }}>Timeline</span>
              </button>
            </div>
          )}
        </React.Fragment>
      )}

      {/* ---------------- MODALS & OVERLAYS ---------------- */}
      
      {/* Toast Bar */}
      {toast && (
        <div className="harbor-pop" style={{ position: "absolute", bottom: 84, left: "50%", transform: "translateX(-50%)", background: C.ink, color: C.card, padding: "10px 18px", borderRadius: 999, fontSize: 13, fontWeight: 500, zIndex: 100, boxShadow: "0 8px 24px rgba(0,0,0,0.2)" }}>
          {toast}
        </div>
      )}

      {/* Add Sheet */}
      {showAdd && (
        <div style={{ position: "absolute", inset: 0, background: C.overlay, backdropFilter: "blur(4px)", zIndex: 200, display: "flex", flexDirection: "column", justifyContent: "flex-end" }}>
          <div className="harbor-sheet" style={{ background: C.card, borderTopLeftRadius: 28, borderTopRightRadius: 28, padding: "20px 20px calc(20px + env(safe-area-inset-bottom))", maxHeight: "90%", display: "flex", flexDirection: "column", gap: 16 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <h3 style={{ fontFamily: "Fraunces, serif", fontSize: 18, fontWeight: 600, margin: 0, color: C.ink }}>New Capture</h3>
              <button onClick={() => setShowAdd(false)} style={btnReset}><IconPlus size={20} color={C.driftwood} style={{ transform: "rotate(45deg)" }} /></button>
            </div>

            <textarea 
              ref={addNoteRef} 
              value={addNote} 
              onChange={(e) => { setAddNote(e.target.value); autoGrow(e.target); }} 
              placeholder="Write a reflection or memory..." 
              style={{ width: "100%", border: "none", outline: "none", background: "transparent", resize: "none", fontFamily: "inherit", fontSize: 15, color: C.ink, minHeight: 60, maxHeight: 140 }} 
            />

            {/* Media Preview Strip */}
            {addMediaList.length > 0 && (
              <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4 }}>
                {addMediaList.map((m) => (
                  <div key={m.tempId} style={{ position: "relative", width: 72, height: 72, borderRadius: 12, overflow: "hidden", flexShrink: 0, background: C.mist }}>
                    {m.type === "audio" ? (
                      <div style={{ width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center", background: C.harborSoft }}><IconMic size={20} color={C.harbor} /></div>
                    ) : (
                      <img src={m.dataUrl} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                    )}
                    <button onClick={() => setAddMediaList((prev) => prev.filter((i) => i.tempId !== m.tempId))} style={{ position: "absolute", top: 4, right: 4, width: 18, height: 18, borderRadius: "50%", background: "rgba(0,0,0,0.6)", color: "#FFF", border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10 }}>✕</button>
                  </div>
                ))}
              </div>
            )}

            {/* Actions Bar */}
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", borderTop: `1px solid ${C.mistDeep}`, paddingTop: 12 }}>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => fileInputRef.current && fileInputRef.current.click()} style={{ ...btnReset, background: C.mist, borderRadius: 12, padding: "8px 12px", color: C.ink, fontSize: 12, fontWeight: 600, gap: 6 }}>
                  <IconImagePlus size={16} /> Attach Media
                </button>
                <input ref={fileInputRef} type="file" multiple accept="image/*,video/*" onChange={handleFilesChosen} />
                
                <button onClick={isRecording ? stopRecording : startRecording} style={{ ...btnReset, background: isRecording ? C.clay : C.mist, borderRadius: 12, padding: "8px 12px", color: isRecording ? "#FFF" : C.ink, fontSize: 12, fontWeight: 600, gap: 6 }}>
                  <IconMic size={16} /> {isRecording ? `${recordingSeconds}s` : "Audio"}
                </button>
              </div>

              <button onClick={saveEntry} disabled={!addNote.trim() && addMediaList.length === 0} style={{ background: C.harbor, color: "#FFF", border: "none", borderRadius: 999, padding: "10px 20px", fontSize: 13, fontWeight: 600, cursor: "pointer", opacity: (!addNote.trim() && addMediaList.length === 0) ? 0.5 : 1 }}>
                Save
              </button>
            </div>
          </div>
        </div>
      )}

      {/* View Entry Modal */}
      {viewEntryId && entries.find((e) => e.id === viewEntryId) && (
        (() => {
          const entry = entries.find((e) => e.id === viewEntryId);
          return (
            <div style={{ position: "absolute", inset: 0, background: C.overlay, backdropFilter: "blur(6px)", zIndex: 200, display: "flex", flexDirection: "column" }}>
              <div className="harbor-fade" style={{ flex: 1, background: C.card, display: "flex", flexDirection: "column", overflow: "hidden" }}>
                <div style={{ padding: "16px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                  <button onClick={() => setViewEntryId(null)} style={btnReset}><IconArrowLeft size={20} color={C.ink} /></button>
                  <span style={{ fontSize: 12, color: C.driftwood, fontWeight: 500 }}>{fullTimestamp(entry.createdAt)}</span>
                  <button onClick={() => { deleteEntries([entry.id]); setViewEntryId(null); }} style={btnReset}><IconTrash size={18} color={C.clay} /></button>
                </div>

                <div className="harbor-scroll" style={{ flex: 1, overflowY: "auto", padding: "0 20px 20px" }}>
                  {entry.mediaIds.length > 0 && (
                    <div style={{ borderRadius: 20, overflow: "hidden", marginBottom: 16, background: C.mist }}>
                      {(() => {
                        const m = mediaById(entry.mediaIds[activeMediaIndex]);
                        if (!m) return null;
                        if (m.type === "audio") return (
                          <div style={{ padding: 24, textAlign: "center" }}>
                            <IconMic size={32} color={C.harbor} />
                            <audio controls src={m.dataUrl} style={{ width: "100%", marginTop: 12 }} />
                          </div>
                        );
                        return <img src={m.dataUrl} alt="" style={{ width: "100%", display: "block" }} />;
                      })()}
                    </div>
                  )}

                  {isEditingNote ? (
                    <div>
                      <textarea ref={draftNoteRef} value={draftNote} onChange={(e) => setDraftNote(e.target.value)} style={{ width: "100%", border: `1px solid ${C.mistDeep}`, borderRadius: 12, padding: 12, fontSize: 14, outline: "none", background: C.mist, color: C.ink, fontFamily: "inherit" }} />
                      <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                        <button onClick={() => saveNoteEdit(entry.id)} style={{ background: C.harbor, color: "#FFF", border: "none", borderRadius: 8, padding: "6px 14px", fontSize: 12, fontWeight: 600 }}>Save</button>
                        <button onClick={() => setIsEditingNote(false)} style={{ background: "transparent", color: C.driftwood, border: "none", fontSize: 12 }}>Cancel</button>
                      </div>
                    </div>
                  ) : (
                    <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12 }}>
                      <p style={{ fontSize: 15, color: C.ink, lineHeight: 1.5, margin: 0, flex: 1, whiteSpace: "pre-wrap" }}>{entry.note || <span style={{ color: C.driftwood, fontStyle: "italic" }}>No note attached</span>}</p>
                      <button onClick={() => { setDraftNote(entry.note || ""); setIsEditingNote(true); }} style={btnReset}><IconEdit size={16} color={C.driftwood} /></button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        })()
      )}

      {/* Create New POV Modal */}
      {showNewPovModal && (
        <div style={{ position: "absolute", inset: 0, background: C.overlay, backdropFilter: "blur(4px)", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <div className="harbor-pop" style={{ background: C.card, borderRadius: 24, padding: 20, width: "100%", maxWidth: 320, display: "flex", flexDirection: "column", gap: 14 }}>
            <h3 style={{ fontFamily: "Fraunces, serif", fontSize: 18, fontWeight: 600, margin: 0, color: C.ink }}>Create New POV</h3>
            <input value={newPovName} onChange={(e) => setNewPovName(e.target.value)} placeholder="POV Name (e.g., Morning Coffee)" style={{ width: "100%", border: `1px solid ${C.mistDeep}`, borderRadius: 12, padding: "10px 12px", fontSize: 13, outline: "none", background: C.mist, color: C.ink }} />
            
            <div style={{ display: "flex", gap: 8, overflowX: "auto", padding: "4px 0" }}>
              {POV_SWATCHES.map((swatch) => (
                <button key={swatch} onClick={() => setNewPovColor(swatch)} style={{ width: 24, height: 24, borderRadius: "50%", background: swatch, border: newPovColor === swatch ? `2px solid ${C.ink}` : "none", cursor: "pointer", flexShrink: 0 }} />
              ))}
            </div>

            <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
              <button onClick={async () => { if (await createPov(newPovName, newPovColor, newPovDescription)) setShowNewPovModal(false); }} style={{ flex: 1, background: C.harbor, color: "#FFF", border: "none", borderRadius: 12, padding: "10px 0", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Create</button>
              <button onClick={() => setShowNewPovModal(false)} style={{ flex: 1, background: C.mist, color: C.ink, border: "none", borderRadius: 12, padding: "10px 0", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* Confirm Modal */}
      {confirmClear && (
        <div style={{ position: "absolute", inset: 0, background: C.overlay, backdropFilter: "blur(4px)", zIndex: 300, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <div className="harbor-pop" style={{ background: C.card, borderRadius: 24, padding: 20, width: "100%", maxWidth: 280, textAlign: "center" }}>
            <h3 style={{ fontFamily: "Fraunces, serif", fontSize: 18, fontWeight: 600, margin: "0 0 8px", color: C.ink }}>Clear All Data?</h3>
            <p style={{ fontSize: 12.5, color: C.driftwood, margin: "0 0 16px" }}>This action cannot be undone.</p>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={async () => { await persistPovs([]); await persistEntries([]); await persistMedia([]); setConfirmClear(false); setProfileOpen(false); showToast("Data cleared"); }} style={{ flex: 1, background: C.clay, color: "#FFF", border: "none", borderRadius: 12, padding: "10px 0", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Clear</button>
              <button onClick={() => setConfirmClear(false)} style={{ flex: 1, background: C.mist, color: C.ink, border: "none", borderRadius: 12, padding: "10px 0", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Cancel</button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<HarborApp />);
</script>
</body>
</html>
